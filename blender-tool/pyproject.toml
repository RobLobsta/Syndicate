[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syndicate_fracture"
version = "0.1.0"
description = "Headless Blender destruction tool for Syndicate (docs/09_blender_destruction_tool.md)"
requires-python = ">=3.11"
# `bpy` and `mathutils` are supplied by the Blender runtime (4.2 LTS embeds Python 3.11)
# and are deliberately NOT declared here: pip-installing a second bpy would shadow the
# host Blender's and silently change fracture results (D02-S4.1).
dependencies = ["jsonschema>=4.21"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = [
    "syndicate_policy*",
    "syndicate_fracture*",
    "syndicate_deform*",
    "syndicate_dissect*",
    "syndicate_prepare*",
    "syndicate_weapon*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Determinism (G11): the tool's own randomness is PCG32 and its string hashing is FNV
# (`rng.stable_hash`), so nothing here depends on CPython's per-process hash seed. Pinning
# PYTHONHASHSEED would only hide a dependency on it, which is the opposite of useful.

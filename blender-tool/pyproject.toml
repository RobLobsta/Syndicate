[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syndicate_fracture"
version = "0.1.0"
description = "Headless Blender destruction tool for Syndicate (docs/09_blender_destruction_tool.md)"
requires-python = ">=3.11"
# `bpy` and `mathutils` are supplied by the Blender runtime (4.2 LTS embeds Python 3.11)
# and are deliberately NOT declared here: pip-installing a second bpy would shadow the
# host Blender's and silently change fracture results (D02-S4.1).
dependencies = ["jsonschema>=4.21"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["syndicate_fracture*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Determinism: the tool must produce byte-identical output for one seed (G11), so its own
# tests never depend on hash ordering.
env = ["PYTHONHASHSEED=0"]

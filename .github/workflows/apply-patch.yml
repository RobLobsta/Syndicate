name: Apply Patch File

on:
  workflow_dispatch:
    inputs:
      patch_url:
        description: 'Direct URL to the .patch file'
        required: false
        default: 'https://drive.google.com/uc?export=download&id=1vlMlKQv0q6zLOYE7C9-teGIBZcxWFb9l'
        type: string
      branch_name:
        description: 'Branch name for the patch changes'
        required: false
        default: 'apply-ai-patch'
        type: string

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Patch File
        run: |
          URL="${{ inputs.patch_url }}"
          if [[ "$URL" =~ drive.google.com/file/d/([^/]+) ]]; then
            FILE_ID="${BASH_REMATCH[1]}"
            URL="https://drive.google.com/uc?export=download&id=${FILE_ID}"
          fi
          curl -sSL "$URL" -o incoming.patch
          echo "Downloaded patch file preview:"
          head -n 20 incoming.patch

      - name: Apply Patch
        run: |
          git apply incoming.patch
          rm incoming.patch

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'Apply AI patch'
          title: 'Apply AI Patch'
          body: 'This PR applies the latest patch file automatically generated by AI.'
          branch: ${{ inputs.branch_name }}
          base: main

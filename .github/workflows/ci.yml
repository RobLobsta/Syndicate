# CI pipeline (docs/12_testing_validation_ci.md#D12-S5.4).
#
# D12-R11 defines the stages as an ordered sequence of Gradle tasks, each a gate for
# everything after it. It says nothing about *how many runners* that takes, and the ordering
# is what carries the meaning: cheap checks first, so an expensive stage never runs behind a
# formatting error.
#
# So the stages are steps in one job, not one job each. Three jobs meant three checkouts,
# three JDK installs and three Gradle cache restores to run the same work, and the fan-out
# bought nothing — the stages are strictly sequential gates, so there was never any
# parallelism to gain.
#
# Stages 3-6 of D12-S5.4 depend on subsystems that are not finished (asset schemas, physics
# scenarios, the fixture pipeline). Stage 7 (package) is deliberately omitted: it is the one
# stage D12-S5.4 does not mark as a gate, and distribution packaging is not what this branch
# is verifying. `:game-client:distZip` and the D02-E12 art-source assertion come back with it.

name: CI

on:
  # Only the default branch on push. Every other branch is covered by its pull request, and
  # listening to both `push: ["**"]` and `pull_request` ran the whole pipeline twice for the
  # same commit — 6 jobs and ~573 s of runner time per push, for one commit's worth of
  # information.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # D02-E4 / D12-E1: Blender is optional for a developer and mandatory on CI.
  SYNDICATE_REQUIRE_BLENDER: "0"
  # D12-S4.1: strict asset validation is the CI default.
  SYNDICATE_STRICT_ASSETS: "1"

jobs:
  verify:
    name: "Verify (D12-S5.4 stages 0-2)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install ruff
        run: pipx install ruff

      # Stage 0 — formatting, layering, headless safety, doc integrity, memory lint, ruff,
      # and the .gitignore source-tracking guard (DISC-005). Deliberately first and
      # deliberately cheap (D12-R12); a failure here stops the job before anything compiles.
      - name: "Stage 0 — fast checks"
        run: ./gradlew fastChecks --no-daemon

      # Stage 1 — compile every module on the pinned Java 17 toolchain.
      - name: "Stage 1 — assemble"
        run: ./gradlew assemble --no-daemon

      # Stage 2 — G17 in practice: the runner has no DISPLAY, so a rendering dependency that
      # crept into game-core fails here rather than on a dedicated server after deploy.
      - name: "Stage 2 — unit and integration tests"
        run: ./gradlew test -Ptags=unit,integration --no-daemon

      - name: "Stage 2 — blender-tool unit tests"
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest blender-tool/tests/unit -q

      # Only on failure. A green run's reports are never read, and uploading them costs
      # storage and upload time on every single build.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          retention-days: 14

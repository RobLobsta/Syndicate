# Single source of the project version (D02-R17). Stamped into every artifact filename,
# every MANIFEST.MF Implementation-Version, and the `toolVersion` field of every manifest
# the Blender tool writes (D09-S4.4), so a manifest is always traceable to a build.
version=0.1.0
group=dev.syndicate

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
